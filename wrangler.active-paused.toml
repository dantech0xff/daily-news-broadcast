name = "news-engine"
main = "src/adapters/cloudflare.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Channel runner remains durably paused; active mode only unlocks audited migration/canary controls.
[triggers]
crons = ["*/30 * * * *", "0 * * * *"]

[[kv_namespaces]]
binding = "NEWS_CACHE"
id = "8d9fb458825a46b68c7efcca93133b51"

[[durable_objects.bindings]]
name = "NEWS_COORDINATOR"
class_name = "ChannelDeliveryCoordinator"

[exports.ChannelDeliveryCoordinator]
type = "durable-object"
storage = "sqlite"

[vars]
BUILD_VERSION = "cloudflare-aig-byok-20260729"
NEWS_RUNTIME_MODE = "active"
NEWS_DEFAULT_PAUSED = "true"
TOKEN_MAINTENANCE_MODE = "disabled"
OPERATOR_KEY_ID = "operator-main"
DELIVERY_ATTEMPT_TIMEOUT_MS = "30000"
COORDINATOR_REQUEST_TIMEOUT_MS = "600000"
AI_PROVIDER = "gemini"
AI_MODEL = "gemini-3.5-flash-lite"
CLOUDFLARE_ACCOUNT_ID = "6f23d177fcdb5209dfeb68a687ed306d"
AI_GATEWAY_ID = "news-engine"
BROADCAST_MODE = "drip"
DRIP_BATCH_SIZE = "1"
DRIP_DELAY_MS = "0"
MAX_ARTICLES_PER_SOURCE = "3"
MAX_ARTICLES = "18"
CONCURRENCY_LIMIT = "5"
SUMMARY_LANGUAGE = "vi"
CRON_SCHEDULE = "0 0-17 * * *"
