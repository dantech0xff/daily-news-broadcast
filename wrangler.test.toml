name = "news-engine-workers-test"
main = "tests/fixtures/cloudflare-worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "NEWS_CACHE"
id = "00000000000000000000000000000000"

[[durable_objects.bindings]]
name = "NEWS_COORDINATOR"
class_name = "ChannelDeliveryCoordinator"

[exports.ChannelDeliveryCoordinator]
type = "durable-object"
storage = "sqlite"

[vars]
NEWS_RUNTIME_MODE = "active"
NEWS_DEFAULT_PAUSED = "false"
DELIVERY_ATTEMPT_TIMEOUT_MS = "1000"
COORDINATOR_REQUEST_TIMEOUT_MS = "2000"
