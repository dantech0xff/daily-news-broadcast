name = "news-engine"
main = "src/adapters/cloudflare.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Channel runner: every 30min + hourly token refresh for X/Threads
[triggers]
crons = ["*/30 * * * *", "0 * * * *"]

[[kv_namespaces]]
binding = "NEWS_CACHE"
id = "8d9fb458825a46b68c7efcca93133b51"

[vars]
AI_PROVIDER = "gemini"
AI_MODEL = "gemini-3.1-flash-lite"
BROADCAST_MODE = "drip"
DRIP_BATCH_SIZE = "1"
DRIP_DELAY_MS = "0"
MAX_ARTICLES_PER_SOURCE = "3"
MAX_ARTICLES = "18"
CONCURRENCY_LIMIT = "5"
SUMMARY_LANGUAGE = "vi"
CRON_SCHEDULE = "0 0-17 * * *"
