name = "news-engine"
main = "src/adapters/cloudflare.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/30 * * * *", "0 * * * *"]

[[kv_namespaces]]
binding = "NEWS_CACHE"
id = "8d9fb458825a46b68c7efcca93133b51"

[vars]
NEWS_RUNTIME_MODE = "quiesced"
NEWS_DEFAULT_PAUSED = "true"
TOKEN_MAINTENANCE_MODE = "disabled"
DELIVERY_ATTEMPT_TIMEOUT_MS = "30000"
COORDINATOR_REQUEST_TIMEOUT_MS = "600000"
AI_PROVIDER = "gemini"
AI_MODEL = "gemini-3.1-flash-lite"
BROADCAST_MODE = "drip"
DRIP_BATCH_SIZE = "1"
DRIP_DELAY_MS = "0"
MAX_ARTICLES_PER_SOURCE = "3"
MAX_ARTICLES = "18"
CONCURRENCY_LIMIT = "5"
SUMMARY_LANGUAGE = "vi"
CRON_SCHEDULE = "0 0-17 * * *"
